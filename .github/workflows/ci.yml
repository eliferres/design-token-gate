name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        run: node --test tests/*.test.mjs
      - name: Run tests from outside the repo directory
        run: node --test "$GITHUB_WORKSPACE"/tests/*.test.mjs
        working-directory: /
      - name: Grade the demo source against demo/tokens.css
        run: |
          node design-token-gate.mjs --tokens demo/tokens.css --scope demo/clean-src --baseline demo/baseline.json
          node design-token-gate.mjs --tokens demo/tokens.css --scope demo/src --baseline demo/baseline.json && code=0 || code=$?
          [ "$code" = 1 ] || { echo "the hand-typed demo source exited $code, expected 1"; exit 1; }
      - name: Install the packed tarball and run the installed command
        run: |
          npm pack
          npm install --global ./design-token-gate-*.tgz
          design-token-gate --version
          design-token-gate --tokens demo/tokens.css --scope demo/clean-src --baseline demo/baseline.json
